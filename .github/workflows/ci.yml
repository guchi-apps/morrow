name: CI

# 注意: claude-conflict-resolve.ymlが、このワークフローの`workflow_run`（CI / requested /
# develop）を「developへのpush」の代理通知として購読している（guchi-apps/issue-deck#1330。
# claude-code-actionがpushイベントに対応していないため直接pushで受けられない）。したがって
# - ワークフロー名（`CI`）
# - `push: branches: [develop]`トリガー
# を変更・削除すると、コンフリクト自動解消の最速検知経路が無言で止まる（scheduleの15分
# おきの安全網だけが残る）。変更する場合はclaude-conflict-resolve.ymlも合わせて直す。

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
  # GitHub Actions側の障害中に作られたrunは、ジョブが1つも作られないまま`queued`で
  # 固まることがある（#85）。必須チェックの`lint-and-build`がQueuedのまま残るため
  # PRは永久にマージできず、`gh run rerun`でも直らない（runのレコードごと壊れている）。
  # そのときに新しいrunを作り直すための逃げ道。`gh workflow run ci.yml --ref <ブランチ>`。
  # ただしpull_requestのときと違い、developを取り込む前のブランチ先端を検査する
  # （actions/checkoutが`refs/pull/<番号>/merge`ではなくブランチをチェックアウトするため）。
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 外から来た値の判定（`safe-path.ts`・`notice-url.ts`）と、それを二重に持つ
      # `public/sw.js` の結果が一致すること、静かに壊れる件数の計算（履歴の窓・要約の畳んだ範囲）を
      # 確かめる（#248・#265）。
      - name: Test
        run: pnpm test:unit

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          # ビルドは外部サービスへ接続しないため、いずれもCI専用のプレースホルダーでよい。
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_aide_bot
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
